
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wedding RSVP Demo</title>
  <link rel="stylesheet" href="css/rsvp-styles.css">
</head>
<body>
  <main class="card">
    <p class="eyebrow">Wedding RSVP demo</p>
    <h1>We hope you can join us</h1>

    <section id="lookupSection">
      <label for="partyCode">Invitation code</label>
      <div class="row">
        <input id="partyCode" autocomplete="off" placeholder="Example: DEMO1234">
        <button id="lookupButton" type="button">Find invitation</button>
      </div>
      <p class="hint">For the sample data, use <strong>DEMO1234</strong>.</p>
    </section>

    <form id="rsvpForm" hidden>
      <h2 id="partyName"></h2>
      <div id="guestFields"></div>

      <label for="contactEmail">Contact email (optional)</label>
      <input id="contactEmail" type="email" autocomplete="email">

      <label for="message">Message (optional)</label>
      <textarea id="message" maxlength="500" rows="4"></textarea>

      <button id="submitButton" type="submit">Submit RSVP</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <script src="js/rsvp.js"></script>
</body>
</html>
